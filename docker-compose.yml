services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置密码}
      MYSQL_DATABASE: vulnark
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - vp-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build: ./backend
    image: vulnarkplus-backend:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vulnark?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Hibernate 先建表，再执行 db/data.sql 初始化默认账号
      # （该文件在 classpath:db/ 子目录，必须显式指定，Spring 不会自动发现）
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
      SPRING_SQL_INIT_MODE: always
      SPRING_SQL_INIT_DATA_LOCATIONS: classpath:db/data.sql
      SPRING_SQL_INIT_CONTINUE_ON_ERROR: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    volumes:
      - vp-uploads:/app/uploads

  frontend:
    build: ./frontend
    image: vulnarkplus-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${VP_PORT:-18081}:80"

volumes:
  vp-mysql-data:
  vp-uploads:
