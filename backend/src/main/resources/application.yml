server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: vulnark-backend

  datasource:
    url: jdbc:mysql://localhost:3306/vulnark
    username: your_username
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# JWT Configuration
# secret 必须通过环境变量 JWT_SECRET 注入（>=64 字节，HS512 签名要求），
# 启动时校验，为空或过短将拒绝启动。生成方式：openssl rand -base64 64
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000 # 24 hours

# Logging
logging:
  level:
    com.vulnark: info
    com.vulnark.security: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Swagger Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
